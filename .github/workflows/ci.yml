name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:

jobs:
  test-sqlite:
    name: Build and test (SQLite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet restore
      - run: dotnet build --no-restore -warnaserror
      - run: dotnet test --no-build --logger "trx" --results-directory TestResults
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-sqlite
          path: TestResults

  test-sqlserver:
    name: Test against SQL Server + migration check
    runs-on: ubuntu-latest
    services:
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "Ci_Only_Passw0rd!"
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P 'Ci_Only_Passw0rd!' -Q 'SELECT 1' || exit 1"
          --health-interval 10s --health-timeout 5s --health-retries 10
    env:
      # Throwaway credentials for the ephemeral CI container only.
      ATS_TEST_SQLSERVER: "Server=localhost,1433;User Id=sa;Password=Ci_Only_Passw0rd!;TrustServerCertificate=True"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet tool restore
      - run: dotnet build
      - name: Migrations match the model
        run: dotnet ef migrations has-pending-model-changes -p src/AssetTracker.Infrastructure -s src/AssetTracker.Infrastructure --no-build
      - run: dotnet test --no-build

  build-windows:
    name: Build on Windows (target platform)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet build -c Release

  publish:
    name: Publish release artifacts (win-x64)
    # Only for main and manual runs; pull requests and feature branches stop at build/test.
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    needs: [test-sqlite, test-sqlserver, build-windows]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Publish web, worker and migrations bundle
        shell: pwsh
        run: ./build/publish.ps1 -Version "0.1.${{ github.run_number }}"
      - uses: actions/upload-artifact@v4
        with:
          name: assettracker-web
          path: artifacts/web
      - uses: actions/upload-artifact@v4
        with:
          name: assettracker-worker
          path: artifacts/worker
      - uses: actions/upload-artifact@v4
        with:
          name: assettracker-efbundle
          path: artifacts/efbundle
      - uses: actions/upload-artifact@v4
        with:
          name: assettracker-deploy
          path: artifacts/deploy
